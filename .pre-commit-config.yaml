repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-private-key
  - repo: local
    hooks:
      - id: check-docs-integrity
        name: check docs integrity
        entry: python scripts/check_docs.py
        language: system
        pass_filenames: false
        always_run: true
      - id: check-no-nul
        name: check tracked files for NUL bytes
        entry: python scripts/check_no_nul.py
        language: system
        pass_filenames: false
        always_run: true
